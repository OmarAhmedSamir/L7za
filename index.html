<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L7za - Instants</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Auth Screen -->
        <div id="authView" class="view glass-card hidden">
            <h1 class="brand-title">L7za <span>Instants</span></h1>
            <div class="auth-form">
                <input type="email" id="authEmail" placeholder="Email address" class="glass-input">
                <input type="password" id="authPassword" placeholder="Password" class="glass-input">
                <input type="text" id="authUsername" placeholder="Username (for signup)" class="glass-input">
                <div class="auth-actions">
                    <button id="loginBtn" class="glass-btn primary">Log In</button>
                    <button id="signupBtn" class="glass-btn secondary">Sign Up</button>
                </div>
            </div>
        </div>

        <!-- Main Dashboard View -->
        <div id="mainView" class="view hidden">
            <!-- Header Bar -->
            <header class="app-header glass-bar">
                <div class="brand">L7za</div>
                <div class="header-actions">
                    <button class="icon-btn" id="openProfileBtn">
                        <img id="navAvatar" src="https://via.placeholder.com/40" class="avatar-sm" alt="Profile">
                    </button>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="content-area">
                <!-- Feed Section -->
                <section id="feedSection" class="section-view active">
                    <h2 class="section-title">Instants Feed</h2>
                    <div id="instantsContainer" class="instants-grid">
                        <!-- Feed items rendered dynamically -->
                    </div>
                </section>

                <!-- Camera / Instant Creation Section -->
                <section id="cameraSection" class="section-view">
                    <div class="camera-wrapper glass-card">
                        <video id="cameraVideo" autoplay playsinline class="video-preview"></video>
                        <canvas id="cameraCanvas" class="hidden"></canvas>
                        <img id="capturedPreview" class="captured-preview hidden" alt="Captured Instant">
                        <div class="camera-controls">
                            <button id="captureBtn" class="shutter-btn"></button>
                            <button id="retakeBtn" class="glass-btn secondary hidden">Retake</button>
                            <button id="postInstantBtn" class="glass-btn primary hidden">Post Instant</button>
                        </div>
                    </div>
                </section>

                <!-- Friends & Search Section -->
                <section id="friendsSection" class="section-view">
                    <div class="search-box glass-card">
                        <input type="text" id="userSearchInput" placeholder="Search users by username..." class="glass-input">
                        <button id="searchUsersBtn" class="glass-btn primary">Search</button>
                    </div>

                    <div class="tabs-nav glass-bar">
                        <button id="tabSearchResults" class="tab-btn active">Results</button>
                        <button id="tabPendingRequests" class="tab-btn">Requests (<span id="reqCount">0</span>)</button>
                    </div>

                    <div id="searchResultsList" class="user-list">
                        <p class="placeholder-text">Search for people to add them.</p>
                    </div>

                    <div id="pendingRequestsList" class="user-list hidden">
                        <p class="placeholder-text">No pending friend requests.</p>
                    </div>
                </section>

                <!-- Profile Section -->
                <section id="profileSection" class="section-view">
                    <div class="profile-card glass-card">
                        <div class="avatar-upload-wrapper">
                            <img id="profileAvatar" src="https://via.placeholder.com/100" class="avatar-lg" alt="Profile Picture">
                            <label for="avatarInput" class="glass-btn secondary avatar-upload-btn">Change Photo</label>
                            <input type="file" id="avatarInput" accept="image/*" class="hidden">
                        </div>
                        <h2 id="profileUsername" class="profile-username">@username</h2>
                        <button id="logoutBtn" class="glass-btn danger">Log Out</button>
                    </div>
                </section>
            </main>

            <!-- Bottom Liquid Navigation -->
            <nav class="bottom-nav glass-bar">
                <button class="nav-item active" data-target="feedSection">
                    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span>Feed</span>
                </button>
                <button class="nav-item" data-target="cameraSection">
                    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 4h-3.17L14.41 2H9.59L8.17 4H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2z"/></svg>
                    <span>Instant</span>
                </button>
                <button class="nav-item" data-target="friendsSection">
                    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                    <span>Friends</span>
                </button>
            </nav>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
